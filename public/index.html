<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sultans Radar — kite forecast</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css?v=live-conditions-fit-20260926" />
</head>
<body>
<div class="app">
  <header>
    <div class="brand">Sultans <b>Radar</b></div>
    <div class="time-now"><b id="timeLabel">—</b></div>
    <div class="spot-summary" id="spotSummary" aria-live="polite" hidden>
      <span class="spot-arrow" id="spotArrow">·</span>
      <strong id="spotName">—</strong>
      <b><span id="spotSpeed">–</span> kt</b>
      <span>Dir <b id="spotDirText">–</b></span>
      <span>Gusts <b id="spotGust">–</b></span>
      <span>Temp <b id="spotTemp">–</b></span>
      <span>Precip <b id="spotPrecip">–</b></span>
      <span class="spot-kite" id="spotKite">–</span>
      <span class="spot-links">
        <a class="spot-wg" id="spotWg" target="_blank" rel="noopener noreferrer" aria-label="Open Windguru Pro forecast" title="Open Windguru Pro forecast"><img src="/windguru.jpg" alt="" /><span>Windguru ↗</span></a>
        <button class="spot-live" id="spotLiveToggle" type="button" aria-controls="gpLivePanel" aria-expanded="false" hidden>Live</button>
        <button class="spot-settings" id="spotSettings" type="button" aria-label="Edit suitable wind direction" title="Edit suitable wind direction">⚙</button>
      </span>
    </div>
    <span class="updated" id="updated">loading…</span>
    <button class="control" id="modelBtn" title="Forecast model">ECMWF IFS 9 km</button>
    <label class="threshold-control" title="Kiteable wind threshold">
      <span>Threshold</span>
      <select id="thresholdSelect" aria-label="Kiteable wind threshold">
        <option value="10">10 kt</option>
        <option value="12">12 kt</option>
        <option value="14">14 kt</option>
        <option value="16">16 kt</option>
        <option value="18">18 kt</option>
      </select>
    </label>
  </header>

  <main class="map-shell">
    <div id="map"></div>
    <div class="loading" id="loading">Loading forecast…</div>
    <div class="map-transport" aria-label="Timeline controls">
      <button class="step" id="prevSlot" aria-label="Previous forecast period">‹</button>
      <button class="play" id="play" aria-label="Play forecast">▶</button>
      <button class="step" id="nextSlot" aria-label="Next forecast period">›</button>
    </div>
    <div class="map-legend" aria-label="Sustained wind legend in knots">
      <span class="legend-title">Wind kt</span>
      <span><i style="background:#73879c"></i><b id="leg0">&lt;12</b></span>
      <span><i style="background:#25d88a"></i><b id="leg1">12</b></span>
      <span><i style="background:#b7de36"></i><b id="leg2">18</b></span>
      <span><i style="background:#f2bc35"></i><b id="leg3">25</b></span>
      <span><i style="background:#ff713f"></i><b id="leg4">32</b></span>
      <span><i style="background:#e83655"></i><b id="leg5">38</b></span>
      <span><i style="background:#a855f7"></i><b id="leg6">45+</b></span>
    </div>
    <div class="map-model" id="mapModel" hidden aria-live="polite"></div>
    <div class="map-attrib">Weather data by <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) · ICON/ECMWF</div>
    <section class="dir-settings" id="dirSettings" hidden>
      <button class="dir-close" id="dirClose" type="button" aria-label="Close direction settings">✕</button>
      <div class="dir-head" id="dirDragHandle"><b id="dirSpotName">Spot</b><span>drag</span></div>
      <span id="dirSummary">Suitable wind direction</span>
      <div class="dir-rose" id="dirRose" aria-label="Suitable wind direction compass"></div>
      <label class="dir-toggle"><input id="dirInvert" type="checkbox" checked /> Show where wind blows to</label>
      <div class="dir-fields">
        <label>From <input id="dirFrom" type="number" min="0" max="359" step="1" /></label>
        <label>To <input id="dirTo" type="number" min="0" max="359" step="1" /></label>
      </div>
      <div class="dir-actions">
        <button id="dirSave" type="button">Save</button>
        <button id="dirReset" type="button">Reset</button>
        <button id="dirCopy" type="button">Copy config</button>
      </div>
    </section>

    <section class="graph-panel" id="graphPanel" hidden>
      <button class="gp-close" id="gpClose" aria-label="Close graph">✕</button>
      <div class="gp-head">
        <div class="gp-heading"><b id="gpName">—</b><span id="gpSub">15-day forecast · daylight shaded</span></div>
        <span class="view-toggle" aria-label="Spot detail view">
          <button id="tableView" type="button" class="active">Table</button>
          <button id="graphView" type="button">Graph</button>
        </span>
        <span class="gp-legend">
          <span><i style="background:var(--wind)"></i>wind</span>
          <span><i style="background:var(--gust)"></i>gusts</span>
          <span><i style="background:var(--precip)"></i>precip</span>
        </span>
      </div>
      <div class="gp-content">
        <div class="gp-forecast" id="gpForecast">
          <div id="spotTable" class="spot-table-wrap"></div>
          <div class="gp-dir" id="gpDir" aria-label="Wind direction forecast" hidden></div>
          <div id="graph" hidden></div>
        </div>
        <aside class="gp-live-panel" id="gpLivePanel" aria-label="Live conditions sources" hidden>
          <div class="gp-live-head"><b>Live now</b></div>
          <div id="gpLiveCards"></div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="timeline">
    <div class="days" id="days" aria-label="Forecast timeline" tabindex="0"></div>
  </footer>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/app.js?v=live-conditions-fit-20260926"></script>
</body>
</html>
